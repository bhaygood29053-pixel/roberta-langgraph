openapi: 3.1.0
info:
  title: Roberta Chat Gateway
  version: "1.0.0"
  description: >
    Read-only conversational gateway to ROBERTA — Verified On-Chain Intelligence.
    The gateway does not expose tool selection, CMIS/provider routing, or execution authority.
servers:
  - url: https://YOUR-ROBERTA-GATEWAY.example.com
paths:
  /v1/gateway/capabilities:
    get:
      operationId: getRobertaGatewayCapabilities
      summary: Get Roberta gateway capabilities
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Gateway capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
        "401":
          description: Unauthorized
  /v1/gateway/ask:
    post:
      operationId: askRoberta
      summary: Send one user message to Roberta
      description: >
        Sends one message through the normal Roberta runtime. The caller cannot
        select tools, Scouts, CMIS operations, providers, routes, or execution modes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: Roberta final reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResponse"
        "400":
          description: Invalid or unsupported request
        "401":
          description: Unauthorized
        "413":
          description: Request too large
        "503":
          description: Roberta unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    AskRequest:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          description: Natural-language user message for Roberta.
    AskResponse:
      type: object
      additionalProperties: false
      required:
        - service
        - status
        - gateway_contract
        - mode
        - reply
        - execution_authorized
      properties:
        service:
          type: string
          const: roberta_bridge
        status:
          type: string
          const: ok
        gateway_contract:
          type: string
          const: roberta-chat-gateway/v1
        mode:
          type: string
          const: read_only
        reply:
          type: string
        execution_authorized:
          type: boolean
          const: false
    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required:
        - service
        - status
        - gateway_contract
        - mode
        - ask_path
        - tool_selection_allowed
        - direct_cmis_access
        - execution_authorized
        - private_core_required
      properties:
        service:
          type: string
          const: roberta_bridge
        status:
          type: string
          const: ok
        gateway_contract:
          type: string
          const: roberta-chat-gateway/v1
        mode:
          type: string
          const: read_only
        ask_path:
          type: string
          const: /v1/gateway/ask
        tool_selection_allowed:
          type: boolean
          const: false
        direct_cmis_access:
          type: boolean
          const: false
        execution_authorized:
          type: boolean
          const: false
        private_core_required:
          type: boolean
          const: true
