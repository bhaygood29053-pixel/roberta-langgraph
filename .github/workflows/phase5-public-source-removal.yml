name: Phase 5 Public Source Removal Gate

on:
  push:
    branches:
      - main
      - phase5/public-source-removal
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-source-removal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out ROBERTA public shell
        uses: actions/checkout@v4

      - name: Check out protected ROBERTA baseline
        uses: actions/checkout@v4
        with:
          repository: bhaygood29053-pixel/roberta-langgraph
          ref: add5a9c6dfefb0304c21efcf198aa8704d37d376
          path: roberta-protected-baseline

      - name: Check out protected CMIS baseline
        uses: actions/checkout@v4
        with:
          repository: bhaygood29053-pixel/cmis
          ref: 45551d112e0779343c0d0e50d0d2631efc88f76c
          path: cmis-public

      - name: Check out current CMIS public shell
        uses: actions/checkout@v4
        with:
          repository: bhaygood29053-pixel/cmis
          ref: 1aab91b5be99ccf2c399b0302c18b0b10a8546fd
          path: cmis-current

      - name: Capture public heads
        shell: bash
        run: |
          echo "PHASE4_ROBERTA_PUBLIC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PHASE4_CMIS_PUBLIC_SHA=$(git -C cmis-current rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PHASE5_ROBERTA_PUBLIC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PHASE5_CMIS_PUBLIC_SHA=$(git -C cmis-current rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify protected source is absent from current public HEADs
        env:
          PHASE5_ROBERTA_PUBLIC_ROOT: .
          PHASE5_CMIS_PUBLIC_ROOT: cmis-current
          PHASE5_EVIDENCE_PATH: phase5-evidence/phase5-public-source-removal.json
        run: |
          mkdir -p phase5-evidence
          python scripts/phase5_public_source_removal_validation.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build requests python-dotenv websocket-client langgraph langchain-core "pypdf>=5"

      - name: Build private-core wheels from protected baselines
        shell: bash
        run: |
          set -euo pipefail
          rm -rf phase5-build phase5-dist
          mkdir -p phase5-build/cmis/liquidity_scout/cmis phase5-build/cmis/cmis_core
          mkdir -p phase5-build/roberta/src/roberta phase5-build/roberta/src/roberta_core
          mkdir -p phase5-dist/cmis phase5-dist/roberta

          cp cmis-public/liquidity_scout/cmis/*.py phase5-build/cmis/liquidity_scout/cmis/
          rm -f             phase5-build/cmis/liquidity_scout/cmis/__init__.py             phase5-build/cmis/liquidity_scout/cmis/capabilities.py             phase5-build/cmis/liquidity_scout/cmis/http.py

          cat > phase5-build/cmis/pyproject.toml <<'EOF'
          [build-system]
          requires = ["setuptools>=68", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "cmis-private-core"
          version = "0.2.0"
          requires-python = ">=3.11"
          dependencies = []

          [tool.setuptools.packages.find]
          where = ["."]
          include = ["cmis_core*", "liquidity_scout.cmis*"]
          namespaces = true
          EOF

          cat > phase5-build/cmis/cmis_core/__init__.py <<'EOF'
          __version__ = "0.2.0"
          PHASE = 3
          PUBLIC_SHELL_REPOSITORY = "bhaygood29053-pixel/cmis"
          PUBLIC_SHELL_BASELINE = "bd9aaa786a9188d3edbfa35692b6754fd9b8b769"
          EOF

          cat > phase5-build/cmis/cmis_core/api.py <<'EOF'
          from __future__ import annotations

          CUTOVER_CONTRACT = "cmis-private-core/v1"

          def runtime_gateway_class():
              from liquidity_scout.cmis.runtime_gateway import RuntimeCMISGateway
              return RuntimeCMISGateway

          def runtime_contract():
              from liquidity_scout.cmis.gateway import KNOWN_CHAINS, SUPPORTED_CHAINS
              from liquidity_scout.cmis.runtime_gateway import SUPPORTED_SERVICES, RuntimeCMISGateway
              return {
                  "contract": CUTOVER_CONTRACT,
                  "gateway_class": RuntimeCMISGateway,
                  "supported_services": tuple(SUPPORTED_SERVICES),
                  "supported_chains": tuple(SUPPORTED_CHAINS),
                  "known_chains": tuple(KNOWN_CHAINS),
              }
          EOF

          for dir in learning memory policy prompts specialists; do
            cp -a "roberta-protected-baseline/src/roberta/$dir" "phase5-build/roberta/src/roberta/$dir"
          done
          for file in             graph.py             decision_synthesis.py             evidence_aware.py             readiness_intelligence.py             recommendation_policy.py             pretrade_ux.py; do
            cp "roberta-protected-baseline/src/roberta/$file" "phase5-build/roberta/src/roberta/$file"
          done

          cat > phase5-build/roberta/pyproject.toml <<'EOF'
          [build-system]
          requires = ["setuptools>=68", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "roberta-private-core"
          version = "0.2.0"
          requires-python = ">=3.11"
          dependencies = ["langgraph", "langchain-core", "pypdf>=5"]

          [tool.setuptools.packages.find]
          where = ["src"]
          include = ["roberta*", "roberta_core*"]
          namespaces = true

          [tool.setuptools.package-data]
          "roberta.learning" = [
            "sources/*.md",
            "sources/*.gz.b64",
            "source_alignments/*.json",
            "assets/*.svg",
          ]
          EOF

          cat > phase5-build/roberta/src/roberta_core/__init__.py <<'EOF'
          __version__ = "0.2.0"
          PHASE = 3
          PUBLIC_SHELL_REPOSITORY = "bhaygood29053-pixel/roberta-langgraph"
          PUBLIC_SHELL_BASELINE = "a684352c741c520037759d2e6436187861eda66e"
          EOF

          cat > phase5-build/roberta/src/roberta_core/api.py <<'EOF'
          from __future__ import annotations

          CUTOVER_CONTRACT = "roberta-private-core/v1"

          def build_graph(*args, **kwargs):
              from roberta.graph import build_graph as _build_graph
              return _build_graph(*args, **kwargs)

          def graph_builder():
              from roberta.graph import build_graph as _build_graph
              return _build_graph
          EOF

          python -m build --wheel --outdir phase5-dist/cmis phase5-build/cmis
          python -m build --wheel --outdir phase5-dist/roberta phase5-build/roberta

      - name: Assemble source-stripped public shells
        shell: bash
        run: |
          set -euo pipefail
          rm -rf phase5-runtime
          mkdir -p phase5-runtime/public-shell/roberta
          mkdir -p phase5-runtime/public-shell/liquidity_scout
          mkdir -p phase5-runtime/site
          mkdir -p phase5-runtime/evidence

          cp -a src/roberta/. phase5-runtime/public-shell/roberta/
          rm -rf             phase5-runtime/public-shell/roberta/learning             phase5-runtime/public-shell/roberta/memory             phase5-runtime/public-shell/roberta/policy             phase5-runtime/public-shell/roberta/prompts             phase5-runtime/public-shell/roberta/specialists
          rm -f             phase5-runtime/public-shell/roberta/graph.py             phase5-runtime/public-shell/roberta/decision_synthesis.py             phase5-runtime/public-shell/roberta/evidence_aware.py             phase5-runtime/public-shell/roberta/readiness_intelligence.py             phase5-runtime/public-shell/roberta/recommendation_policy.py             phase5-runtime/public-shell/roberta/pretrade_ux.py

          cp -a cmis-current/liquidity_scout/. phase5-runtime/public-shell/liquidity_scout/
          find phase5-runtime/public-shell/liquidity_scout/cmis -maxdepth 1 -type f -name '*.py'             ! -name '__init__.py'             ! -name 'capabilities.py'             ! -name 'http.py'             -delete
          find cmis-current -maxdepth 1 -type f -name '*.py' -exec cp {} phase5-runtime/public-shell/ \;

          test ! -e phase5-runtime/public-shell/roberta/graph.py
          test ! -e phase5-runtime/public-shell/roberta/evidence_aware.py
          test ! -e phase5-runtime/public-shell/liquidity_scout/cmis/runtime_gateway.py
          test ! -e phase5-runtime/public-shell/liquidity_scout/cmis/gateway.py
          echo "PHASE4_PUBLIC_STRIP_VERIFIED=1" >> "$GITHUB_ENV"

      - name: Install private cores and overlay public shells
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-deps --target phase5-runtime/site phase5-dist/cmis/*.whl
          python -m pip install --no-deps --target phase5-runtime/site phase5-dist/roberta/*.whl

          rsync -a --ignore-existing             phase5-runtime/public-shell/roberta/             phase5-runtime/site/roberta/
          rsync -a --ignore-existing             phase5-runtime/public-shell/liquidity_scout/             phase5-runtime/site/liquidity_scout/
          find phase5-runtime/public-shell -maxdepth 1 -type f -name '*.py' -exec cp {} phase5-runtime/site/ \;

          test -e phase5-runtime/site/roberta/graph.py
          test -e phase5-runtime/site/roberta/private_core.py
          test -e phase5-runtime/site/liquidity_scout/cmis/runtime_gateway.py
          test -e phase5-runtime/site/liquidity_scout/cmis/http.py
          test -e phase5-runtime/site/liquidity_scout/cmis_private_core.py
          python -m compileall -q phase5-runtime/site

      - name: Re-run Phase 3 cutover proof
        env:
          PYTHONPATH: phase5-runtime/site
          ROBERTA_PRIVATE_CORE_REQUIRED: "1"
          CMIS_PRIVATE_CORE_REQUIRED: "1"
        run: |
          python scripts/phase3_required_split_validation.py

      - name: Re-run Phase 4 split integration gate on Phase 5 public shells
        env:
          PYTHONPATH: phase5-runtime/site
          ROBERTA_PRIVATE_CORE_REQUIRED: "1"
          CMIS_PRIVATE_CORE_REQUIRED: "1"
          PHASE4_PUBLIC_STRIP_VERIFIED: "1"
          PHASE4_EVIDENCE_PATH: phase5-runtime/evidence/phase4-evidence.json
        run: |
          python scripts/phase4_split_integration_validation.py

      - name: Show Phase 5 evidence
        run: |
          cat phase5-evidence/phase5-public-source-removal.json
          cat phase5-runtime/evidence/phase4-evidence.json

      - name: Upload Phase 5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase5-public-source-removal-evidence
          path: |
            phase5-evidence/phase5-public-source-removal.json
            phase5-runtime/evidence/phase4-evidence.json
          if-no-files-found: error
