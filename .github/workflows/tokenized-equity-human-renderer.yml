name: Tokenized Equity Human Renderer

on:
  pull_request:
    paths:
      - "src/roberta/tokenized_equity_human_renderer.py"
      - "tests/test_tokenized_equity_human_renderer.py"
      - "docs/X1_TOKENIZED_EQUITY_HUMAN_V1.md"
      - ".github/workflows/tokenized-equity-human-renderer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  human-renderer:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out public ROBERTA shell
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install public dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run Tokenized Equity Human renderer regressions
        run: python -m pytest -q tests/test_tokenized_equity_human_renderer.py

      - name: Prove existing Human Intelligence renderer coexistence
        run: |
          python -m pytest -q \
            tests/test_human_response_contract.py \
            tests/test_human_response_renderer.py

      - name: Contract import proof
        run: |
          python - <<'PY'
          from roberta.tokenized_equity_human_renderer import (
              TOKENIZED_EQUITY_HUMAN_PLAN_CONTRACT,
              TOKENIZED_EQUITY_HUMAN_RESPONSE_CONTRACT,
          )
          assert TOKENIZED_EQUITY_HUMAN_PLAN_CONTRACT == "roberta_tokenized_equity_human_plan/v1"
          assert TOKENIZED_EQUITY_HUMAN_RESPONSE_CONTRACT == "roberta_tokenized_equity_human_response/v1"
          print("ROBERTA #427 public Tokenized Equity Human renderer: PASS")
          PY

      - name: Diff hygiene
        run: git diff --check
