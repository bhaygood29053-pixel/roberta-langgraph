name: X1 Tokenized Equity Scout Projection

on:
  pull_request:
    paths:
      - "src/roberta/cmis/contracts.py"
      - "src/roberta/cmis/tokenized_equity_intelligence.py"
      - "src/roberta/x1_scout/tokenized_equity_intelligence.py"
      - "tests/test_x1_tokenized_equity_projection.py"
      - "docs/X1_TOKENIZED_EQUITY_SCOUT_PROJECTION_V1.md"
      - ".github/workflows/x1-tokenized-equity-scout-projection.yml"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection-contract:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out public ROBERTA shell
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install public dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run typed Tokenized Equity Scout projection tests
        run: python -m pytest -q tests/test_x1_tokenized_equity_projection.py

      - name: Prove Wallet Relationship and Daily Brief coexistence
        run: |
          python -m pytest -q \
            tests/test_wallet_relationship_intelligence_adoption.py \
            tests/test_x1_daily_intelligence_brief.py \
            tests/test_x1_daily_intelligence_brief_live_adoption.py

      - name: Diff hygiene
        run: git diff --check
