name: Bootstrap Beta Product Proof Bridge

on:
  push:
    branches:
      - feature/public-beta-product-proof-456
    paths:
      - "scripts/patch_beta_product_proof_bridge.py"
      - ".github/workflows/beta-product-proof-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-beta-product-proof-456
          fetch-depth: 0
      - run: python scripts/patch_beta_product_proof_bridge.py
      - name: Commit bridge patch and remove bootstrap artifacts
        run: |
          rm scripts/patch_beta_product_proof_bridge.py
          rm .github/workflows/beta-product-proof-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/roberta/bridge_http.py scripts/patch_beta_product_proof_bridge.py .github/workflows/beta-product-proof-bootstrap.yml
          git commit -m "ROBERTA #456: wire privacy-safe beta bridge observation"
          git push origin HEAD:feature/public-beta-product-proof-456
