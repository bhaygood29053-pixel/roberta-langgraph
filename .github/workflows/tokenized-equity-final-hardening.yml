name: Tokenized Equity Final Hardening

on:
  pull_request:
    paths:
      - "src/roberta/x1_scout/**"
      - "src/roberta/tokenized_equity_human_renderer.py"
      - "src/roberta/web_ui_current_capabilities.py"
      - "tests/test_x1_tokenized_equity_projection.py"
      - "tests/test_tokenized_equity_claim_integrity.py"
      - "tests/test_tokenized_equity_human_renderer.py"
      - "tests/test_wallet_relationship_intelligence_adoption.py"
      - "tests/test_x1_daily_intelligence_brief.py"
      - "tests/test_human_response_contract_v1.py"
      - "tests/test_human_response_renderer_v1.py"
      - "tests/test_web_ui_current_capabilities.py"
      - "tests/test_web_ui_intelligence_cards.py"
      - ".github/workflows/tokenized-equity-final-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-hardening:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out public ROBERTA shell
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install public dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Prove Tokenized Equity authority chain
        run: |
          python -m pytest -q \
            tests/test_x1_tokenized_equity_projection.py \
            tests/test_tokenized_equity_claim_integrity.py \
            tests/test_tokenized_equity_human_renderer.py

      - name: Prove existing intelligence coexistence
        run: |
          python -m pytest -q \
            tests/test_wallet_relationship_intelligence_adoption.py \
            tests/test_x1_daily_intelligence_brief.py \
            tests/test_human_response_contract_v1.py \
            tests/test_human_response_renderer_v1.py

      - name: Prove website and chat capability surface
        run: |
          python -m pytest -q \
            tests/test_web_ui_current_capabilities.py \
            tests/test_web_ui_intelligence_cards.py

      - name: Prove final public authority invariants
        run: |
          python - <<'PY'
          from roberta.tokenized_equity_human_renderer import (
              TOKENIZED_EQUITY_HUMAN_PLAN_CONTRACT,
              TOKENIZED_EQUITY_HUMAN_RESPONSE_CONTRACT,
          )

          assert TOKENIZED_EQUITY_HUMAN_PLAN_CONTRACT == "roberta_tokenized_equity_human_plan/v1"
          assert TOKENIZED_EQUITY_HUMAN_RESPONSE_CONTRACT == "roberta_tokenized_equity_human_response/v1"
          print("ROBERTA #431 public final hardening: PASS")
          PY

      - name: Diff hygiene
        run: git diff --check
