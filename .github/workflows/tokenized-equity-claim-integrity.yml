name: Tokenized Equity Claim Integrity

on:
  pull_request:
    paths:
      - "src/roberta/x1_scout/tokenized_equity_claim_integrity.py"
      - "src/roberta/x1_scout/tokenized_equity_intelligence.py"
      - "src/roberta/x1_scout/wallet_relationship_intelligence.py"
      - "tests/test_tokenized_equity_claim_integrity.py"
      - "tests/test_x1_tokenized_equity_projection.py"
      - "tests/test_wallet_relationship_intelligence_adoption.py"
      - "docs/X1_TOKENIZED_EQUITY_CLAIM_INTEGRITY_V1.md"
      - ".github/workflows/tokenized-equity-claim-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-integrity:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out public ROBERTA shell
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install public dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run Tokenized Equity Claim Integrity tests
        run: python -m pytest -q tests/test_tokenized_equity_claim_integrity.py

      - name: Prove upstream projection and wallet coexistence
        run: |
          python -m pytest -q \
            tests/test_x1_tokenized_equity_projection.py \
            tests/test_wallet_relationship_intelligence_adoption.py

      - name: Prove Daily Brief coexistence
        run: |
          python -m pytest -q \
            tests/test_x1_daily_intelligence_brief.py \
            tests/test_x1_daily_intelligence_brief_live_adoption.py

      - name: Diff hygiene
        run: git diff --check
