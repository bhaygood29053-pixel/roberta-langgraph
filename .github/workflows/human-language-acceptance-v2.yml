name: Human ROBERTA v2 Language Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/human-language-acceptance-v2.yml"
      - ".vale.ini"
      - ".github/styles/RobertaHuman/**"
      - "evals/human_language_acceptance_v2.json"
      - "evals/human_response_learning_v1.json"
      - "scripts/run_human_language_acceptance.py"
      - "scripts/export_human_responses_for_vale.py"
      - "src/roberta/human_language_acceptance.py"
      - "src/roberta/human_response_quality.py"
      - "src/roberta/human_response_renderer.py"
      - "tests/test_human_language_acceptance_v2.py"
      - "tests/test_human_response_quality_v1.py"
      - "tests/test_human_plain_language_runtime_v2.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/human-language-acceptance-v2.yml"
      - ".vale.ini"
      - ".github/styles/RobertaHuman/**"
      - "evals/human_language_acceptance_v2.json"
      - "evals/human_response_learning_v1.json"
      - "scripts/run_human_language_acceptance.py"
      - "scripts/export_human_responses_for_vale.py"
      - "src/roberta/human_language_acceptance.py"
      - "src/roberta/human_response_quality.py"
      - "src/roberta/human_response_renderer.py"
      - "tests/test_human_language_acceptance_v2.py"
      - "tests/test_human_response_quality_v1.py"
      - "tests/test_human_plain_language_runtime_v2.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  language-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ROBERTA
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ROBERTA test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run realistic Human language acceptance sweep
        run: |
          python scripts/run_human_language_acceptance.py \
            --source evals/human_language_acceptance_v2.json \
            --markdown-output .vale-generated/human-language-acceptance.md

      - name: Export existing 100-response Human corpus
        run: |
          python scripts/export_human_responses_for_vale.py \
            --source evals/human_response_learning_v1.json \
            --output .vale-generated/human-response-corpus.md

      - name: Vale — realistic acceptance responses
        uses: vale-cli/vale-action@v3
        with:
          version: "3.21.0"
          files: .vale-generated/human-language-acceptance.md
          config: .vale.ini
          sync: false
          filter_mode: nofilter
          min_alert_level: warning
          fail_level: error

      - name: Vale — existing Human reference corpus
        uses: vale-cli/vale-action@v3
        with:
          version: "3.21.0"
          files: .vale-generated/human-response-corpus.md
          config: .vale.ini
          sync: false
          filter_mode: nofilter
          min_alert_level: warning
          fail_level: error

      - name: Human language and renderer regressions
        run: |
          python -m pytest -q \
            tests/test_human_language_acceptance_v2.py \
            tests/test_human_response_quality_v1.py \
            tests/test_human_plain_language_runtime_v2.py
