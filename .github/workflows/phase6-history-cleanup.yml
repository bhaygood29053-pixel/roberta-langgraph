name: Phase 6 Historical Git Cleanup

on:
  push:
    branches:
      - phase6/history-cleanup-run

permissions:
  contents: write

jobs:
  rewrite-public-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRE_REWRITE_MAIN: 67b7848da9a3279a8b566ea78eebb8d69dab3982
    steps:
      - name: Check out repository with complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install history rewrite tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install git-filter-repo

      - name: Fetch every branch and tag
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git ls-remote --heads --tags origin | sort > phase6-pre-rewrite-refs.txt
          echo "PRE_REWRITE_REF_COUNT=$(wc -l < phase6-pre-rewrite-refs.txt)" >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload pre-rewrite ref recovery map
        uses: actions/upload-artifact@v4
        with:
          name: phase6-roberta-pre-rewrite-refs
          path: phase6-pre-rewrite-refs.txt
          retention-days: 90
          if-no-files-found: error

      - name: Materialize all remote branches locally
        shell: bash
        run: |
          set -euo pipefail
          current_branch="$(git branch --show-current)"
          while read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [ "$branch" = "HEAD" ] && continue
            [ "$branch" = "$current_branch" ] && continue
            git branch -f "$branch" "$ref"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/)

      - name: Rewrite protected ROBERTA paths from all history
        shell: bash
        run: |
          set -euo pipefail
          git filter-repo --force \
            --path src/roberta/learning/ \
            --path src/roberta/memory/ \
            --path src/roberta/policy/ \
            --path src/roberta/prompts/ \
            --path src/roberta/specialists/ \
            --path src/roberta/graph.py \
            --path src/roberta/decision_synthesis.py \
            --path src/roberta/evidence_aware.py \
            --path src/roberta/readiness_intelligence.py \
            --path src/roberta/recommendation_policy.py \
            --path src/roberta/pretrade_ux.py \
            --invert-paths

      - name: Verify rewritten local refs are clean
        shell: bash
        run: |
          set -euo pipefail
          if git rev-list --all | grep -qx "$PRE_REWRITE_MAIN"; then
            echo "Pre-rewrite main is still reachable after filtering."
            exit 1
          fi

          failed=0
          while read -r ref; do
            if git ls-tree -r --name-only "$ref" | grep -E -q '^src/roberta/(learning/|memory/|policy/|prompts/|specialists/|graph\.py$|decision_synthesis\.py$|evidence_aware\.py$|readiness_intelligence\.py$|recommendation_policy\.py$|pretrade_ux\.py$)'; then
              echo "Protected ROBERTA path remains in $ref"
              failed=1
            fi
          done < <(git for-each-ref --format='%(refname)' refs/heads/ refs/tags/)
          test "$failed" -eq 0

      - name: Force-push rewritten branches and tags
        shell: bash
        run: |
          set -euo pipefail
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force --all origin
          git push --force --tags origin
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify remote refs after rewrite
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads --tags origin | sort > phase6-post-rewrite-refs.txt
          echo "Pre-rewrite refs: ${PRE_REWRITE_REF_COUNT}"
          echo "Post-rewrite refs: $(wc -l < phase6-post-rewrite-refs.txt)"
          test "$(wc -l < phase6-post-rewrite-refs.txt)" -eq "$PRE_REWRITE_REF_COUNT"
          echo "PHASE6_ROBERTA_HISTORY_REWRITE=PASS"
          echo "HISTORICAL_CLEANUP_COMPLETE=TRUE"

      - name: Upload post-rewrite ref map
        uses: actions/upload-artifact@v4
        with:
          name: phase6-roberta-post-rewrite-refs
          path: phase6-post-rewrite-refs.txt
          retention-days: 90
          if-no-files-found: error
