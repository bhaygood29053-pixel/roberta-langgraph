name: Apply Wallet Relationship roadmap reconciliation 410

on:
  push:
    branches:
      - docs/reconcile-wallet-relationship-410-20260910
    paths:
      - ".github/workflows/apply-roadmap-wallet-410.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out roadmap branch
        uses: actions/checkout@v4
        with:
          ref: docs/reconcile-wallet-relationship-410-20260910
          fetch-depth: 0

      - name: Reconcile Wallet Relationship roadmap status
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/LANGGRAPH_ROADMAP.md")
          lines = path.read_text(encoding="utf-8").splitlines()
          hits = {
              "checkpoint": 0,
              "wallet_live": 0,
              "reconciled": 0,
              "active_heading": 0,
              "active_wallet": 0,
              "accepted_platform": 0,
          }
          out = []
          for line in lines:
              if line == "## Live checkpoint — 2026-09-09":
                  out.append("## Live checkpoint — 2026-09-10")
                  hits["checkpoint"] += 1
                  continue
              if line.startswith("- **X1 direct wallet-relationship productization: QUEUED under #410"):
                  out.append("- **X1 direct wallet-relationship intelligence (#410): ACCEPTED END TO END.** CMIS #631 is accepted in CMIS 1.28; public ROBERTA PR #419 merged as `98d983ca23a40424c23b6db0446181a392cc6cc8`; protected `roberta-core` PR #92 passed exact-head Python 3.11, Python 3.12, and pinned public/private overlay CI and merged as `a8187b37f41aee782b1c68399106a4241b5b85c3`. ROBERTA may surface exact verified X1 direct-transfer relationships while preserving non-ownership, non-identity, non-whale/insider/bot, non-intent, non-manipulation/fraud, non-causality, non-risk, and incomplete-history boundaries. `execution_authorized=false`.")
                  hits["wallet_live"] += 1
                  continue
              if line.startswith("Last reconciled: 2026-09-09"):
                  out.append("Last reconciled: 2026-09-10 (America/New_York)")
                  hits["reconciled"] += 1
                  continue
              if line.startswith("## Active execution order — 2026-09-09"):
                  out.append("## Active execution order — 2026-09-10 America/New_York")
                  hits["active_heading"] += 1
                  continue
              if line.startswith("2. **Direct wallet-relationship intelligence (#410): BLOCKED ON CMIS #631.**"):
                  out.append("2. **Direct wallet-relationship intelligence (#410): ACCEPTED END TO END.** Public X1 Scout adoption is merged in #419 and protected Human/Machine Decision Object + Claim Integrity enforcement is merged in `roberta-core` #92. Exact verified transfer facts are usable; unsupported ownership/identity/behavior/intent/coordination/manipulation/fraud/causality/risk/completeness claims remain blocked. `execution_authorized=false`.")
                  hits["active_wallet"] += 1
                  continue
              out.append(line)
              if line.startswith("- **Large-Trade Discovery: ACCEPTED.**"):
                  out.append("- **Wallet Relationship Intelligence: ACCEPTED END TO END.** Public X1 Scout PR #419 plus protected `roberta-core` PR #92 provide bounded direct-transfer intelligence through the canonical ROBERTA Decision Object / Claim Integrity path without ownership, identity, behavior, causality, risk, or execution upgrades.")
                  hits["accepted_platform"] += 1

          missing = {k: v for k, v in hits.items() if v != 1}
          if missing:
              raise SystemExit(f"roadmap reconciliation anchor drift: {missing}")
          path.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

      - name: Commit roadmap reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LANGGRAPH_ROADMAP.md
          git commit -m "docs: reconcile accepted Wallet Relationship intelligence"
          git push origin HEAD:docs/reconcile-wallet-relationship-410-20260910
