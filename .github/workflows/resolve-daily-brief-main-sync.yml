name: Resolve Daily Brief Main Sync

on:
  push:
    branches:
      - feat/x1-daily-brief-live-adoption-412

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/x1-daily-brief-live-adoption-412

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Merge accepted main with additive conflict preservation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'MAIN_ALREADY_PRESENT=TRUE'
            exit 0
          fi

          cat >> .git/info/attributes <<'EOF'
          .github/workflows/tests.yml merge=union
          src/roberta/cmis/capabilities.py merge=union
          src/roberta/cmis/client.py merge=union
          src/roberta/cmis/contracts.py merge=union
          src/roberta/cmis/http.py merge=union
          src/roberta/x1_scout/graph.py merge=union
          src/roberta/x1_scout/state.py merge=union
          EOF

          git merge --no-ff origin/main -m 'Merge accepted main into Daily Brief adoption'

          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/roberta/cmis/capabilities.py'): [
                  ('X1_INTELLIGENCE_BRIEF_MIN_CMIS_CONTRACT_VERSION = "1.28.0"',
                   'X1_INTELLIGENCE_BRIEF_MIN_CMIS_CONTRACT_VERSION = "1.29.0"'),
                  ('Require accepted CMIS 1.28 X1 Intelligence Brief promotion.',
                   'Require accepted CMIS 1.29 X1 Intelligence Brief promotion.'),
              ],
              Path('src/roberta/cmis/contracts.py'): [
                  ('Service-specific promotion flags used by CMIS 1.28 X1 Intelligence Brief.',
                   'Service-specific promotion flags used by CMIS 1.29 X1 Intelligence Brief.'),
              ],
              Path('tests/test_x1_daily_intelligence_brief_live_adoption.py'): [
                  ('def capability_manifest(version="1.28.0"):',
                   'def capability_manifest(version="1.29.0"):'),
              ],
          }
          for path, edits in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f'missing expected CMIS 1.29 migration anchor in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          client = Path('src/roberta/cmis/client.py')
          text = client.read_text(encoding='utf-8')
          start = text.find('    def x1_intelligence_brief_inputs(')
          end = text.find('    def concentration_warning_intelligence(', start)
          if start < 0 or end < 0:
              raise SystemExit('missing CMIS client coexistence anchors')
          methods = '\n'.join([
              '    def x1_intelligence_brief_inputs(',
              '        self,',
              '        *,',
              '        chain: str,',
              '        subjects: list[str],',
              '        window_start: str,',
              '        window_end: str,',
              '        requested_services: list[str],',
              '    ) -> CMISEnvelope:',
              '        ...',
              '',
              '    def wallet_relationship_intelligence(',
              '        self,',
              '        *,',
              '        chain: str,',
              '        transaction_signature: str,',
              '        asset_mint: str,',
              '        sender_wallet: str,',
              '        recipient_wallet: str,',
              '    ) -> CMISEnvelope:',
              '        ...',
              '',
              '',
          ])
          client.write_text(text[:start] + methods + text[end:], encoding='utf-8')
          PY

          git add src/roberta/cmis/capabilities.py src/roberta/cmis/client.py src/roberta/cmis/contracts.py tests/test_x1_daily_intelligence_brief_live_adoption.py
          git commit --amend --no-edit
          git diff --check HEAD^ HEAD

      - name: Install ROBERTA test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Prove Wallet Relationship and Daily Brief coexist
        run: |
          python -m compileall -q src/roberta
          python -m pytest -q tests/test_wallet_relationship_intelligence_adoption.py tests/test_x1_daily_intelligence_brief_live_adoption.py tests/test_x1_daily_intelligence_brief.py

      - name: Push only after coexistence proof
        shell: bash
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor origin/main HEAD && [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
            git push origin HEAD:feat/x1-daily-brief-live-adoption-412
          else
            echo 'NO_RECONCILED_COMMIT_TO_PUSH=TRUE'
          fi
