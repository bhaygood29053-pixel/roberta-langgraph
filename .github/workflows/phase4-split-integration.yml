name: Phase 4 Split Integration Gate

on:
  push:
    branches:
      - phase4/split-integration-ci
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  split-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out ROBERTA public shell
        uses: actions/checkout@v4

      - name: Check out CMIS public shell
        uses: actions/checkout@v4
        with:
          repository: bhaygood29053-pixel/cmis
          ref: 88548287182cf3c10c24389e7355a6e3e7bf94b5
          path: cmis-public

      - name: Capture public heads
        shell: bash
        run: |
          echo "PHASE4_ROBERTA_PUBLIC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PHASE4_CMIS_PUBLIC_SHA=$(git -C cmis-public rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build requests python-dotenv websocket-client langgraph langchain-core "pypdf>=5"

      - name: Build private-core wheels from protected baselines
        shell: bash
        run: |
          set -euo pipefail
          rm -rf phase4-build phase4-dist
          mkdir -p phase4-build/cmis/liquidity_scout/cmis phase4-build/cmis/cmis_core
          mkdir -p phase4-build/roberta/src/roberta phase4-build/roberta/src/roberta_core
          mkdir -p phase4-dist/cmis phase4-dist/roberta

          cp cmis-public/liquidity_scout/cmis/*.py phase4-build/cmis/liquidity_scout/cmis/
          rm -f             phase4-build/cmis/liquidity_scout/cmis/__init__.py             phase4-build/cmis/liquidity_scout/cmis/capabilities.py             phase4-build/cmis/liquidity_scout/cmis/http.py

          cat > phase4-build/cmis/pyproject.toml <<'EOF'
          [build-system]
          requires = ["setuptools>=68", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "cmis-private-core"
          version = "0.2.0"
          requires-python = ">=3.11"
          dependencies = []

          [tool.setuptools.packages.find]
          where = ["."]
          include = ["cmis_core*", "liquidity_scout.cmis*"]
          namespaces = true
          EOF

          cat > phase4-build/cmis/cmis_core/__init__.py <<'EOF'
          __version__ = "0.2.0"
          PHASE = 3
          PUBLIC_SHELL_REPOSITORY = "bhaygood29053-pixel/cmis"
          PUBLIC_SHELL_BASELINE = "bd9aaa786a9188d3edbfa35692b6754fd9b8b769"
          EOF

          cat > phase4-build/cmis/cmis_core/api.py <<'EOF'
          from __future__ import annotations

          CUTOVER_CONTRACT = "cmis-private-core/v1"

          def runtime_gateway_class():
              from liquidity_scout.cmis.runtime_gateway import RuntimeCMISGateway
              return RuntimeCMISGateway

          def runtime_contract():
              from liquidity_scout.cmis.gateway import KNOWN_CHAINS, SUPPORTED_CHAINS
              from liquidity_scout.cmis.runtime_gateway import SUPPORTED_SERVICES, RuntimeCMISGateway
              return {
                  "contract": CUTOVER_CONTRACT,
                  "gateway_class": RuntimeCMISGateway,
                  "supported_services": tuple(SUPPORTED_SERVICES),
                  "supported_chains": tuple(SUPPORTED_CHAINS),
                  "known_chains": tuple(KNOWN_CHAINS),
              }
          EOF

          for dir in learning memory policy prompts specialists; do
            cp -a "src/roberta/$dir" "phase4-build/roberta/src/roberta/$dir"
          done
          for file in             graph.py             decision_synthesis.py             evidence_aware.py             readiness_intelligence.py             recommendation_policy.py             pretrade_ux.py; do
            cp "src/roberta/$file" "phase4-build/roberta/src/roberta/$file"
          done

          cat > phase4-build/roberta/pyproject.toml <<'EOF'
          [build-system]
          requires = ["setuptools>=68", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "roberta-private-core"
          version = "0.2.0"
          requires-python = ">=3.11"
          dependencies = ["langgraph", "langchain-core", "pypdf>=5"]

          [tool.setuptools.packages.find]
          where = ["src"]
          include = ["roberta*", "roberta_core*"]
          namespaces = true
          EOF

          cat > phase4-build/roberta/src/roberta_core/__init__.py <<'EOF'
          __version__ = "0.2.0"
          PHASE = 3
          PUBLIC_SHELL_REPOSITORY = "bhaygood29053-pixel/roberta-langgraph"
          PUBLIC_SHELL_BASELINE = "a684352c741c520037759d2e6436187861eda66e"
          EOF

          cat > phase4-build/roberta/src/roberta_core/api.py <<'EOF'
          from __future__ import annotations

          CUTOVER_CONTRACT = "roberta-private-core/v1"

          def build_graph(*args, **kwargs):
              from roberta.graph import build_graph as _build_graph
              return _build_graph(*args, **kwargs)

          def graph_builder():
              from roberta.graph import build_graph as _build_graph
              return _build_graph
          EOF

          python -m build --wheel --outdir phase4-dist/cmis phase4-build/cmis
          python -m build --wheel --outdir phase4-dist/roberta phase4-build/roberta

      - name: Assemble source-stripped public shells
        shell: bash
        run: |
          set -euo pipefail
          rm -rf phase4-runtime
          mkdir -p phase4-runtime/public-shell/roberta
          mkdir -p phase4-runtime/public-shell/liquidity_scout
          mkdir -p phase4-runtime/site
          mkdir -p phase4-runtime/evidence

          cp -a src/roberta/. phase4-runtime/public-shell/roberta/
          rm -rf             phase4-runtime/public-shell/roberta/learning             phase4-runtime/public-shell/roberta/memory             phase4-runtime/public-shell/roberta/policy             phase4-runtime/public-shell/roberta/prompts             phase4-runtime/public-shell/roberta/specialists
          rm -f             phase4-runtime/public-shell/roberta/graph.py             phase4-runtime/public-shell/roberta/decision_synthesis.py             phase4-runtime/public-shell/roberta/evidence_aware.py             phase4-runtime/public-shell/roberta/readiness_intelligence.py             phase4-runtime/public-shell/roberta/recommendation_policy.py             phase4-runtime/public-shell/roberta/pretrade_ux.py

          cp -a cmis-public/liquidity_scout/. phase4-runtime/public-shell/liquidity_scout/
          find phase4-runtime/public-shell/liquidity_scout/cmis -maxdepth 1 -type f -name '*.py'             ! -name '__init__.py'             ! -name 'capabilities.py'             ! -name 'http.py'             -delete
          find cmis-public -maxdepth 1 -type f -name '*.py' -exec cp {} phase4-runtime/public-shell/ \;

          test ! -e phase4-runtime/public-shell/roberta/graph.py
          test ! -e phase4-runtime/public-shell/roberta/evidence_aware.py
          test ! -e phase4-runtime/public-shell/liquidity_scout/cmis/runtime_gateway.py
          test ! -e phase4-runtime/public-shell/liquidity_scout/cmis/gateway.py
          echo "PHASE4_PUBLIC_STRIP_VERIFIED=1" >> "$GITHUB_ENV"

      - name: Install private cores and overlay public shells
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-deps --target phase4-runtime/site phase4-dist/cmis/*.whl
          python -m pip install --no-deps --target phase4-runtime/site phase4-dist/roberta/*.whl

          rsync -a --ignore-existing             phase4-runtime/public-shell/roberta/             phase4-runtime/site/roberta/
          rsync -a --ignore-existing             phase4-runtime/public-shell/liquidity_scout/             phase4-runtime/site/liquidity_scout/
          find phase4-runtime/public-shell -maxdepth 1 -type f -name '*.py' -exec cp {} phase4-runtime/site/ \;

          test -e phase4-runtime/site/roberta/graph.py
          test -e phase4-runtime/site/roberta/private_core.py
          test -e phase4-runtime/site/liquidity_scout/cmis/runtime_gateway.py
          test -e phase4-runtime/site/liquidity_scout/cmis/http.py
          test -e phase4-runtime/site/liquidity_scout/cmis_private_core.py
          python -m compileall -q phase4-runtime/site

      - name: Re-run Phase 3 cutover proof
        env:
          PYTHONPATH: phase4-runtime/site
          ROBERTA_PRIVATE_CORE_REQUIRED: "1"
          CMIS_PRIVATE_CORE_REQUIRED: "1"
        run: |
          python scripts/phase3_required_split_validation.py

      - name: Run Phase 4 split integration gate
        env:
          PYTHONPATH: phase4-runtime/site
          ROBERTA_PRIVATE_CORE_REQUIRED: "1"
          CMIS_PRIVATE_CORE_REQUIRED: "1"
          PHASE4_PUBLIC_STRIP_VERIFIED: "1"
          PHASE4_EVIDENCE_PATH: phase4-runtime/evidence/phase4-evidence.json
        run: |
          python scripts/phase4_split_integration_validation.py

      - name: Show Phase 4 evidence
        run: |
          cat phase4-runtime/evidence/phase4-evidence.json

      - name: Upload Phase 4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase4-split-integration-evidence
          path: phase4-runtime/evidence/phase4-evidence.json
          if-no-files-found: error
