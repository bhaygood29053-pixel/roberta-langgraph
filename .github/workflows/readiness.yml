name: read-only readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-deployment-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public shell
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install public shell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify private-runtime deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from roberta.private_core import PrivateCoreUnavailable, build_graph, private_core_status

          status = private_core_status()
          assert status["required"] is True
          if status["available"]:
              print("ROBERTA_PRIVATE_CORE_AVAILABLE=TRUE")
          else:
              try:
                  build_graph()
              except PrivateCoreUnavailable:
                  pass
              else:
                  raise AssertionError("ROBERTA did not fail closed without its private core")
              print("ROBERTA_PRIVATE_CORE_AVAILABLE=FALSE")
              print("READINESS_DEPLOYMENT_CONFIGURATION_REQUIRED=TRUE")

          print("PUBLIC_FALLBACK_USED=FALSE")
          print("EXECUTION_AUTHORIZED=FALSE")
          PY

      - name: Explain deployment readiness boundary
        run: |
          echo "Full readiness replay runs in an environment where the private ROBERTA runtime, CMIS endpoint, and required model credentials are securely configured."
          echo "The public repository no longer reconstructs private implementation from historical public commits."
