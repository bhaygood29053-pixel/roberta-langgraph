name: read-only readiness

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/readiness.yml"
      - "evals/read_only_decision_v1.json"
      - "src/roberta/readiness*.py"
      - "src/roberta/decision_synthesis.py"
      - "src/roberta/graph.py"
      - "src/roberta/cmis/**"
      - "src/roberta/memory/**"
      - "src/roberta/x1_scout/**"
      - "src/roberta/solana_scout/**"
      - "src/roberta/tools/**"

permissions:
  contents: read

jobs:
  controlled-replay:
    name: controlled degraded-evidence + freshness replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[deepseek]'
      - name: Check replay configuration
        id: replay_preflight
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/readiness
          if [[ -z "${DEEPSEEK_API_KEY:-}" ]]; then
            python - <<'PY'
            import json
            from pathlib import Path
            report = {
                "schema_version": 1,
                "authority": "historical_evaluation_snapshot",
                "live_market_authority": False,
                "summary": {
                    "deployment_blockers": [
                        "GitHub Actions secret DEEPSEEK_API_KEY is not configured for the readiness runner."
                    ]
                },
            }
            Path("artifacts/readiness/replay-config-blocker.json").write_text(
                json.dumps(report, indent=2, sort_keys=True), encoding="utf-8"
            )
            PY
            exit 1
          fi
      - name: Run controlled replay
        id: replay
        if: steps.replay_preflight.outcome == 'success'
        continue-on-error: true
        run: |
          roberta-readiness-replay \
            --output artifacts/readiness/replay-${GITHUB_SHA}.json
      - name: Upload replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roberta-readiness-replay-${{ github.run_id }}
          path: artifacts/readiness/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce replay gate
        if: always()
        shell: bash
        run: |
          test "${{ steps.replay_preflight.outcome }}" = "success"
          test "${{ steps.replay.outcome }}" = "success"

  configured-live-path:
    name: configured Scout -> CMIS live readiness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CMIS_BASE_URL: ${{ vars.CMIS_BASE_URL || secrets.CMIS_BASE_URL }}
      CMIS_API_KEY: ${{ secrets.CMIS_API_KEY }}
      ROBERTA_SOLANA_PROVIDER_ENABLED: ${{ vars.ROBERTA_SOLANA_PROVIDER_ENABLED }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[deepseek]'
      - name: Check live-path configuration
        id: live_preflight
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/readiness
          missing=()
          [[ -n "${DEEPSEEK_API_KEY:-}" ]] || missing+=("DEEPSEEK_API_KEY")
          [[ -n "${CMIS_BASE_URL:-}" ]] || missing+=("CMIS_BASE_URL repository variable/secret")
          if (( ${#missing[@]} )); then
            MISSING="$(IFS=', '; echo "${missing[*]}")" python - <<'PY'
            import json
            import os
            from pathlib import Path
            missing = os.environ["MISSING"]
            report = {
                "schema_version": 1,
                "authority": "historical_evaluation_snapshot",
                "live_market_authority": False,
                "summary": {
                    "deployment_blockers": [
                        "Readiness live-path configuration missing: " + missing
                    ]
                },
            }
            Path("artifacts/readiness/live-config-blocker.json").write_text(
                json.dumps(report, indent=2, sort_keys=True), encoding="utf-8"
            )
            PY
            exit 1
          fi
      - name: Run configured live readiness corpus
        id: live_readiness
        if: steps.live_preflight.outcome == 'success'
        continue-on-error: true
        run: |
          roberta-readiness \
            --output artifacts/readiness/live-${GITHUB_SHA}.json
      - name: Upload live readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roberta-readiness-live-${{ github.run_id }}
          path: artifacts/readiness/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce live readiness gate
        if: always()
        shell: bash
        run: |
          test "${{ steps.live_preflight.outcome }}" = "success"
          test "${{ steps.live_readiness.outcome }}" = "success"
