name: tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run deterministic tests
        run: |
          set +e
          python -m pytest -v -m 'not live and not cmis_live' --junitxml=pytest-results.xml 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          exit $status
      - name: Retain pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            pytest-output.txt
            pytest-results.xml
