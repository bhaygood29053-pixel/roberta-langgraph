name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - phase6/final-closure

permissions:
  contents: read

jobs:
  public-shell-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public shell
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install public dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate Phase 6 public boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          protected_dirs = (
              "learning", "memory", "policy", "prompts", "specialists",
          )
          protected_files = (
              "graph.py", "decision_synthesis.py", "evidence_aware.py",
              "readiness_intelligence.py", "recommendation_policy.py",
              "pretrade_ux.py",
          )
          root = Path("src/roberta")
          remaining = []
          for name in protected_dirs:
              path = root / name
              if path.exists():
                  remaining.extend(str(item) for item in path.rglob("*") if item.is_file())
          for name in protected_files:
              path = root / name
              if path.exists():
                  remaining.append(str(path))
          assert not remaining, remaining

          from roberta.private_core import (
              PrivateCoreUnavailable,
              build_graph,
              private_core_required,
              private_core_status,
          )

          assert private_core_required() is True
          status = private_core_status()
          assert status["required"] is True
          assert status["available"] is False
          assert status["source"] == "unavailable"

          try:
              build_graph()
          except PrivateCoreUnavailable:
              pass
          else:
              raise AssertionError("ROBERTA public shell did not fail closed without private core")

          print("PHASE6_ROBERTA_PUBLIC_HISTORY_BOUNDARY=PASS")
          print("ROBERTA_PRIVATE_CORE_REQUIRED=PASS")
          print("PUBLIC_FALLBACK_USED=FALSE")
          print("EXECUTION_AUTHORIZED=FALSE")
          PY
