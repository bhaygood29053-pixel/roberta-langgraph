name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - phase6/final-closure

permissions:
  contents: read

jobs:
  public-shell-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public shell
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install public dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,mcp]'

      - name: Validate Phase 6 public boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          protected_dirs = (
              "learning", "memory", "policy", "prompts", "specialists",
          )
          protected_files = (
              "graph.py", "decision_synthesis.py", "evidence_aware.py",
              "readiness_intelligence.py", "recommendation_policy.py",
              "pretrade_ux.py",
          )
          root = Path("src/roberta")
          remaining = []
          for name in protected_dirs:
              path = root / name
              if path.exists():
                  remaining.extend(str(item) for item in path.rglob("*") if item.is_file())
          for name in protected_files:
              path = root / name
              if path.exists():
                  remaining.append(str(path))
          assert not remaining, remaining

          assert not Path("src/roberta_core").exists(), (
              "private roberta_core package must never exist in the public repository"
          )

          direct_private_imports = []
          allowed_private_import_file = Path("src/roberta/private_core.py")
          for path in Path("src/roberta").rglob("*.py"):
              text = path.read_text(encoding="utf-8")
              if "from roberta_core" in text or "import roberta_core" in text:
                  if path != allowed_private_import_file:
                      direct_private_imports.append(str(path))
          assert not direct_private_imports, (
              "public code may reach roberta_core only through "
              f"{allowed_private_import_file}: {direct_private_imports}"
          )

          forbidden_secret_files = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.name == ".env" or path.suffix.lower() in {
                  ".pem", ".key", ".p12", ".pfx"
              } or path.name in {"id_rsa", "id_ed25519"}:
                  forbidden_secret_files.append(str(path))
          assert not forbidden_secret_files, (
              "secret-bearing files must not be committed to the public repository: "
              f"{forbidden_secret_files}"
          )

          import ast

          mcp_edge = Path("src/roberta/mcp_gateway.py")
          if mcp_edge.exists():
              forbidden_roots = {
                  "roberta_core",
                  "roberta.x1_scout",
                  "roberta.solana_scout",
                  "roberta.cmis",
                  "liquidity_scout",
              }
              imported = []
              tree = ast.parse(mcp_edge.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imported.extend(alias.name for alias in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      imported.append(node.module)
              bypasses = sorted(
                  name for name in imported
                  if any(
                      name == root or name.startswith(root + ".")
                      for root in forbidden_roots
                  )
              )
              assert not bypasses, (
                  "MCP edge must remain transport-only and may not import private "
                  f"or authority-bypassing modules: {bypasses}"
              )

          from roberta.private_core import (
              PrivateCoreUnavailable,
              build_graph,
              private_core_required,
              private_core_status,
          )

          assert private_core_required() is True
          status = private_core_status()
          assert status["required"] is True
          assert status["available"] is False
          assert status["source"] == "unavailable"

          try:
              build_graph()
          except PrivateCoreUnavailable:
              pass
          else:
              raise AssertionError("ROBERTA public shell did not fail closed without private core")

          print("PHASE6_ROBERTA_PUBLIC_HISTORY_BOUNDARY=PASS")
          print("ROBERTA_PRIVATE_CORE_REQUIRED=PASS")
          print("PUBLIC_FALLBACK_USED=FALSE")
          print("EXECUTION_AUTHORIZED=FALSE")
          PY

      - name: Run public bridge contract tests
        run: python -m pytest -q tests/test_bridge_http.py

      - name: Run MCP gateway contract tests
        run: python -m pytest -q tests/test_mcp_gateway.py
