on:
  push:
    branches:
      - feat/wallet-relationship-adoption-410
    paths:
      - ".github/workflows/apply-wallet-relationship-adoption-410.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wallet-relationship-adoption-410

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Apply bounded Wallet Relationship adoption
        run: |
          python - <<'PY'
