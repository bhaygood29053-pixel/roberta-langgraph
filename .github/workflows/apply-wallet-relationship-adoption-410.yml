name: Apply Wallet Relationship adoption 410

on:
  push:
    branches:
      - feat/wallet-relationship-adoption-410
    paths:
      - ".github/workflows/apply-wallet-relationship-adoption-410.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wallet-relationship-adoption-410
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Apply bounded adoption patch
        run: python scripts/apply_wallet_relationship_adoption_410.py

      - name: Run Wallet Relationship adoption tests
        run: python -m pytest -q tests/test_wallet_relationship_intelligence_adoption.py

      - name: Run adjacent CMIS and Scout regressions
        run: |
          python -m pytest -q \
            tests/test_cmis_capabilities.py \
            tests/test_cmis_http_client.py \
            tests/test_large_trade_discovery_adoption.py \
            tests/test_human_response_renderer_v1.py

      - name: Commit adoption patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/roberta/cmis/wallet_relationship.py \
            src/roberta/x1_scout/wallet_relationship_intelligence.py \
            src/roberta/cmis/contracts.py \
            src/roberta/cmis/capabilities.py \
            src/roberta/cmis/client.py \
            src/roberta/cmis/http.py \
            src/roberta/x1_scout/state.py \
            src/roberta/x1_scout/graph.py \
            src/roberta/x1_scout/tool.py \
            tests/test_wallet_relationship_intelligence_adoption.py
          git commit -m "feat: adopt CMIS wallet relationship intelligence in X1 Scout"
          git push origin HEAD:feat/wallet-relationship-adoption-410

# rerun after embedded-patch indentation fix
