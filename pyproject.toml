[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roberta-langgraph"
version = "0.3.0"
description = "Roberta Oracle / Coordinator built on LangGraph"
requires-python = ">=3.11"
dependencies = [
  "langgraph",
  "langchain-core",
]

[project.optional-dependencies]
deepseek = ["langchain-deepseek"]
dev = ["pytest>=8"]

[project.scripts]
roberta-live = "roberta.live_demo:main"
roberta-serve = "roberta.bridge_http:main"
roberta-readiness = "roberta.readiness_cli:main"
roberta-readiness-replay = "roberta.readiness_replay_cli:main"
roberta-solana-readiness-replay = "roberta.readiness_solana_replay_cli:main"
roberta-pyramid-dashboard = "roberta.learning.pyramid_dashboard:main"
roberta-pyramid-run = "roberta.learning.pyramid_run_cli:main"
roberta-pyramid-remediate = "roberta.learning.pyramid_remediation_cli:main"
roberta-pyramid-regrade = "roberta.learning.pyramid_regrade_cli:main"
roberta-pyramid-source-reconstruct = "roberta.learning.pyramid_source_reconstruction_cli:main"

[tool.setuptools.package-data]
"roberta.learning" = ["sources/*.md", "sources/*.gz.b64"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live: opt-in test that makes a paid external model API call",
  "cmis_live: opt-in integration test against a running CMIS gateway",
]
