[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roberta-langgraph"
version = "0.3.0"
description = "Roberta Oracle / Coordinator built on LangGraph"
requires-python = ">=3.11"
dependencies = [
  "langgraph",
  "langchain-core",
]

[project.optional-dependencies]
deepseek = ["langchain-deepseek"]
dev = ["pytest>=8"]

[project.scripts]
roberta-live = "roberta.live_demo:main"
roberta-serve = "roberta.bridge_http:main"
roberta-readiness = "roberta.readiness_cli:main"
roberta-readiness-replay = "roberta.readiness_replay_cli:main"
roberta-solana-readiness-replay = "roberta.readiness_solana_replay_cli:main"
roberta-pyramid-dashboard = "roberta.learning.pyramid_dashboard_source_entry:main"
roberta-pyramid-run = "roberta.learning.pyramid_run_cli:main"
roberta-pyramid-remediate = "roberta.learning.pyramid_remediation_cli:main"
roberta-pyramid-regrade = "roberta.learning.pyramid_regrade_cli:main"
roberta-pyramid-critical-revalidate = "roberta.learning.pyramid_critical_revalidation_cli:main"
roberta-pyramid-source-reconstruct = "roberta.learning.pyramid_source_reconstruction_cli:main"
roberta-pyramid-migrate-provenance = "roberta.learning.pyramid_provenance_migration_cli:main"
roberta-pyramid-practice = "roberta.learning.pyramid_practice_cli:main"
roberta-pyramid-supplemental-practice = "roberta.learning.pyramid_supplemental_practice_cli:main"
roberta-pyramid-critical-blocker-practice = "roberta.learning.pyramid_critical_blocker_supplemental_cli:main"
roberta-pyramid-critical-retention = "roberta.learning.pyramid_critical_retention_cli:main"
roberta-pyramid-critical-autofix = "roberta.learning.pyramid_critical_autofix_entry:main"
roberta-pyramid-build-mb4e-level2 = "roberta.learning.mb4e_level2_builder_cli:main"
roberta-pyramid-build-mb4e-level3 = "roberta.learning.mb4e_level3_builder_cli:main"
roberta-pyramid-plan-mb4e-source = "roberta.learning.mb4e_source_mastery_plan_cli:main"

[tool.setuptools.package-data]
"roberta.learning" = [
  "sources/*.md",
  "sources/*.gz.b64",
  "source_alignments/*.json",
  "assets/*.svg",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live: opt-in test that makes a paid external model API call",
  "cmis_live: opt-in integration test against a running CMIS gateway",
]
