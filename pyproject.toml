[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roberta-langgraph"
version = "0.3.0"
description = "Roberta Oracle / Coordinator built on LangGraph"
requires-python = ">=3.11"
dependencies = [
  "langgraph",
  "langchain-core",
]

[project.optional-dependencies]
deepseek = ["langchain-deepseek"]
dev = ["pytest>=8"]

[project.scripts]
roberta-live = "roberta.live_demo:main"
roberta-serve = "roberta.bridge_http:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live: opt-in test that makes a paid external model API call",
  "cmis_live: opt-in integration test against a running CMIS gateway",
]
